fields:
  id:
    type: string
    required: true
    description: Unique identifier for the record
    primary_key: true  # This field will be auto-populated with UUID
    system_value: true
  
  entity_identifier:
    type: string
    required: true
    column_mappings: ["entity:data_id"]
    description: External entity identifier

  basespace_collection_id:
    type: string
    description: Basespace collection ID
    use_field_name: true
    sample_identifier: true

  config_id:
    type: string
    description: Configuration ID
    inherit_from_config: id
    configuration_identifier: true
    system_value: true

  read1:
    type: string
    description: Read 1 sequence
    sequence_file: true

  read2:
    type: string
    description: Read 2 sequence
    sequence_file: true

  assembly_length_unambiguous:
      type: integer
      description: Length of unambiguous assembly
      metadata: true
      sync_field: true

  assembly_mean_coverage:
    type: float
    description: Mean coverage of the assembly
    metadata: true
    sync_field: true
  
  gisaid_accession:
    type: string
    description: GISAID accession number
    metadata: true
    sync_field: true
  
  nextclade_aa_dels:
    type: string
    description: Amino acid deletions identified by Nextclade
    metadata: true
    sync_field: true
  
  nextclade_aa_subs:
    type: string
    description: Amino acid substitutions identified by Nextclade
    metadata: true
    sync_field: true
  
  nextclade_clade:
    type: string
    description: Clade assigned by Nextclade
    metadata: true
    sync_field: true

  nextclade_version:
    type: string
    description: Version of Nextclade used
    metadata: true
    sync_field: true
  
  number_N:
    type: string
    description: Number of 'N' bases in the assembly
    metadata: true
    sync_field: true

  pango_lineage:
    type: string
    description: Pango lineage assigned to the sample
    metadata: true
    sync_field: true
  
  pangolin_versions:
    type: string
    description: Versions of Pangolin used
    metadata: true
    sync_field: true
  
  percent_reference_coverage:
    type: string
    description: Percent coverage of the reference genome
    metadata: true
    sync_field: true

  vadr_num_alerts:
    type: string
    description: Number of alerts identified by VADR
    metadata: true
    sync_field: true
  
  upload_date:
    type: string
    description: Date of sample collection
    metadata: true
    sync_field: true
  # System fields that need to be dropped before submission to terra 
  created_at:
    type: datetime
    required: true
    description: Record creation timestamp
    system_value: true
    
  updated_at:
    type: datetime
    description: Last update datetime
    system_value: true

  uploaded_at:
    type: datetime
    description: Date of sample upload
    system_value: true

  submitted_at:
    type: datetime
    description: Date of sample submission
    system_value: true

  upload_source:
    type: string
    description: Source of sample upload
    system_value: true

  terra_submission_id:
    type: string
    description: Terra submission ID
    system_value: true

  terra_workflow_id:
    type: string
    description: Terra workflow submission ID
    system_value: true
    
  workflow_state:
    type: string
    description: Current state of the workflow
    system_value: true