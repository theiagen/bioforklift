name: Bioforklift Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/bioforklift/**'
      - 'tests/**'
      - 'poetry.lock'
      - 'pyproject.toml'
      - '.github/workflows/pytests.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/bioforklift/**'
      - 'tests/**'
      - 'poetry.lock'
      - 'pyproject.toml'
      - '.github/workflows/pytests.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 2.3.2
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v6
      with:
        path: .venv
        key: venv-${{ runner.os }}-bioforklift-${{ hashFiles('**/poetry.lock') }}
    
    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction

    - name: Run tests with coverage
      run: |
        poetry run python -m pytest tests/ --cov=src/bioforklift --cov-report "xml:coverage.xml" --cov-report=term-missing:skip-covered --junitxml=junit.xml
    
    - name: Coverage comment
      uses: MishaKav/pytest-coverage-comment@v1.12.2
      with:
        pytest-xml-coverage-path: ./coverage.xml
        junitxml-path: ./junit.xml