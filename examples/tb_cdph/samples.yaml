fields:
  id:
    type: string
    required: true
    description: Unique identifier for the record
    primary_key: true  # This field will be auto-populated with UUID
    system_value: true
  
  sample_id:
    type: string
    required: true
    sample_identifier: true

  entity_type:
    type: string
    required: true
    description: Original entity from source table
    inherit_from_config: entity_type
    system_value: true

  tb_config_id:
    type: string
    description: Configuration ID
    inherit_from_config: id
    configuration_identifier: true
    system_value: true

  read1:
    type: string
    description: Read 1 sequence
    sequence_file: true

  read2:
    type: string
    description: Read 2 sequence
    sequence_file: true

  uploaded_at:
    type: string
    description: Date of sample upload

  # System fields that need to be dropped before submission to terra 
  created_at:
    type: datetime
    required: true
    description: Record creation timestamp
    system_value: true
    
  updated_at:
    type: datetime
    description: Last update datetime
    system_value: true

  uploaded_at:
    type: datetime
    description: Date of sample upload
    system_value: true

  submitted_at:
    type: datetime
    description: Date of sample submission
    system_value: true

  upload_source:
    type: string
    description: Source of sample upload
    system_value: true

  terra_submission_id:
    type: string
    description: Terra submission ID
    system_value: true

  terra_workflow_id:
    type: string
    description: Terra workflow submission ID
    system_value: true

  workflow_type:
    type: string
    description: Workflow type
    inherit_from_config: terra_analysis_method
    system_value: true
    
  workflow_state:
    type: string
    description: Current state of the terra workflow
    system_value: true